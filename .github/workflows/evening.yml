name: Sharp-Edge Evening Report (16h30 France)

on:
  schedule:
    - cron: '30 14 * * *'  # UTC+2 (heure été) → 16h30 France
    - cron: '30 15 * * *'  # UTC+1 (heure hiver) → 16h30 France
  workflow_dispatch:

jobs:
  evening-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run daily picks (evening)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REPORT_TYPE: evening
        run: python scripts/3_daily_picks.py

      - name: Generate HTML page
        run: python scripts/4_generate_page.py

      - name: Commit and push
        run: |
          git config user.name "sharp-edge-bot"
          git config user.email "bot@sharp-edge"
          git add docs/
          git diff --staged --quiet || git commit -m "🌆 Evening picks $(date -u +'%Y-%m-%d')"
          git push

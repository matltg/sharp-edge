name: Sharp-Edge Morning Report (4h30 France)

on:
  schedule:
    - cron: '30 2 * * *'  # UTC+2 (heure été) → 4h30 France
    - cron: '30 3 * * *'  # UTC+1 (heure hiver) → 4h30 France
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  morning-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Les deux crons tournent chaque jour : on ne garde que celui qui
      # correspond à l'heure légale actuelle de Paris (évite le double appel API).
      - name: Check DST slot
        id: gate
        run: |
          OFFSET=$(TZ=Europe/Paris date +%z)
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 2 * * *") [ "$OFFSET" = "+0200" ] || RUN=false ;;
              "30 3 * * *") [ "$OFFSET" = "+0100" ] || RUN=false ;;
            esac
          fi
          echo "Paris UTC offset: $OFFSET → run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests pandas numpy

      - name: Run daily picks (morning)
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REPORT_TYPE: morning
        run: python scripts/3_daily_picks.py

      - name: Generate HTML page
        if: steps.gate.outputs.run == 'true'
        run: python scripts/4_generate_page.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "sharp-edge-bot"
          git config user.email "bot@sharp-edge"
          git add docs/
          git diff --staged --quiet || git commit -m "📊 Morning picks $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push

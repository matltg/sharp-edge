name: Sharp-Edge Morning Report (4h30 France)

on:
  schedule:
    # GitHub peut retarder ou ignorer une tâche programmée : plusieurs créneaux,
    # hors des heures rondes. Le rapport ne tourne qu'une fois par jour (marqueur).
    - cron: '37 2 * * *'
    - cron: '37 3 * * *'
    - cron: '7 5 * * *'
    - cron: '7 6 * * *'
  workflow_dispatch:        # déclenchement manuel : tourne toujours

# Un seul lancement à la fois : le suivant voit le marqueur posé par le précédent
concurrency:
  group: sharp-edge-morning
  cancel-in-progress: false

jobs:
  morning-picks:
    runs-on: ubuntu-24.04  # version figée (évite les changements d image GitHub)
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Lancement programmé : seulement à partir de 4h30 (heure de Paris, été comme
      # hiver) et si le rapport du jour n'a pas déjà été fait.
      - name: Check time slot
        id: gate
        run: |
          NOW=$(TZ=Europe/Paris date +%H%M)
          DAY=$(TZ=Europe/Paris date +%F)
          MARKER="docs/picks/.done_${DAY}_morning"
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$NOW" -lt 430 ] || [ -f "$MARKER" ]; then RUN=false; fi
          fi
          echo "Paris $NOW, marqueur $MARKER → run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          echo "late=$([ "$NOW" -ge 430 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests pandas numpy

      - name: Run daily picks (morning)
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REPORT_TYPE: morning
        run: python scripts/3_daily_picks.py

      - name: Generate HTML page
        if: steps.gate.outputs.run == 'true'
        run: python scripts/4_generate_page.py

      # Le marqueur n'est posé qu'à partir de 4h30 : un lancement manuel plus tôt
      # n'empêche pas le rapport programmé.
      - name: Mark report as done
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.late == 'true'
        run: touch "${{ steps.gate.outputs.marker }}"

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "sharp-edge-bot"
          git config user.email "bot@sharp-edge"
          git add -f docs/
          git diff --staged --quiet || git commit -m "📊 Morning picks $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push

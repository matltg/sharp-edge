<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharp-Edge — Initialisation</title>
  <style>
    :root { --bg: #0f172a; --text: #f1f5f9; --accent: #38bdf8; --muted: #94a3b8; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 2rem; }
    .logo { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">⚡ Sharp-Edge</div>
    <p>Sports betting filter — low odds favourites validator</p>
    <p style="margin-top:2rem">Premier rapport disponible demain à 4h30.</p>
    <p>Configure ODDS_API_KEY dans les secrets GitHub pour activer le bot.</p>
  </div>
</body>
</html>
